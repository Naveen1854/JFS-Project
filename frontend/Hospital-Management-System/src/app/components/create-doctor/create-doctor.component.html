<h1 class="text-center text-warning fw-bold mt-4">Add New Doctor</h1>
<hr class="w-50 mx-auto"/>

<div class="container mt-4">
    <div class="card shadow-lg p-4">
        
        <form (ngSubmit)="onSubmit()">

            <!-- Doctor Name -->
            <div class="mb-3">
                <label class="form-label fw-bold">Doctor Name</label>
                <input 
                    type="text"
                    class="form-control form-control-lg"
                    [(ngModel)]="doctor.doctorName"
                    name="doctorName"
                    placeholder="Enter Doctor Name"/>
            </div>

            <!-- Speciality -->
            <div class="mb-3">
                <label class="form-label fw-bold">Speciality</label>
                <input 
                    type="text"
                    class="form-control form-control-lg"
                    [(ngModel)]="doctor.speciality"
                    name="speciality"
                    placeholder="Enter Speciality"/>
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
                <label class="form-label fw-bold">Phone Number</label>
                <input 
                    type="text"
                    class="form-control form-control-lg"
                    [(ngModel)]="doctor.phoneNumber"
                    name="phoneNumber"
                    placeholder="Enter Phone Number"/>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label fw-bold">Email Id</label>
                <input 
                    type="email"
                    class="form-control form-control-lg"
                    [(ngModel)]="doctor.emailId"
                    name="emailId"
                    placeholder="Enter Email Id"/>
            </div>

            <!-- Department ID -->
            <div class="mb-4">
                <label class="form-label fw-bold">Department Id</label>
                <input 
                    type="number"
                    class="form-control form-control-lg"
                    [(ngModel)]="doctor.departmentId"
                    name="departmentId"
                    placeholder="Enter Department Id"/>
            </div>

            <!-- Buttons -->
            <div class="text-center">
                <button class="btn btn-outline-success btn-lg px-4 me-3">Save Doctor</button>
                <button class="btn btn-outline-danger btn-lg px-4" type="reset">Reset</button>
            </div>

        </form>

    </div>
</div>
